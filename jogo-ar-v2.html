<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Meu Jogo de RA</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .instrucoes {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="instrucoes">
    📷 Aponte a câmera para o marcador.png
  </div>

  <!-- targets.mind e personagem.png precisam estar na mesma pasta deste arquivo no GitHub -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <img id="personagem" src="personagem.png" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-image
        src="#personagem"
        position="0 0 0.1"
        width="1"
        height="1"
        animation="property: position; to: 0 0.05 0.1; dir: alternate; loop: true; dur: 1200; easing: easeInOutSine"
      ></a-image>
    </a-entity>
  </a-scene>
</body>
</html>
